name: Daily maintenance

# 03:30 UTC = 09:00 IST, just before the market opens, matching the cron the
# long-running server uses. Finds new IPOs, then validates, repairs and prunes
# the watchlist so the first price check of the day sees a clean list.
on:
  schedule:
    - cron: '30 3 * * 1-5'
  workflow_dispatch:

concurrency:
  group: ipo-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci --omit=dev

      - name: Discover IPOs and clean the watchlist
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: node scripts/run-job.mjs daily

      - name: Save watchlist changes
        run: |
          if [ -z "$(git status --porcelain server/data)" ]; then
            echo "No data changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/data
          git commit -m "chore: daily watchlist maintenance [skip ci]"
          git pull --rebase --autostash origin main
          git push
